[workspace]
members = [
    "core",
    "cli",
    "daemon",
    "tui",
]
resolver = "2"

[workspace.package]
version = "1.0.0-alpha.19"
edition = "2024"
authors = ["ereinaimer"]
description = "a fast and easy to use text expander"
repository = "https://github.com/ereinaimer/taurine"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time"] }
# Single tokio feature set for the whole workspace (union of what core/daemon/cli/tui use).
# cli/tui previously asked for `full`; audited use is runtime/signal/time only, so the
# trimmed set below preserves behavior while avoiding extra tokio modules everywhere.
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "net", "time", "signal", "sync", "io-util", "macros", "process"] }
# Single reqwest line: genai 0.6.5 requires 0.13, so all first-party crates use 0.13.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link Time Optimization (huge win for size)
codegen-units = 1    # Better optimization at the cost of compile time
panic = "unwind"     # Enable unwinding for thread isolation resilience
strip = true         # Strip symbols from the binary

# Hot-path crates trade size for speed; CLI/TUI stay on the size profile.
[profile.release.package.taurine_core]
opt-level = 3

[profile.release.package.taurine_daemon]
opt-level = 3

