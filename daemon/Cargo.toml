[package]
name = "taurine_daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
license-file.workspace = true
publish = false

[dependencies]
taurine_core = { path = "../core" }
tracing = { workspace = true }
tokio = { version = "1.0", features = ["full", "test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
tracing-appender = "0.2.4"
tonic = "0.14"
arboard = { version = "3.4.1", features = ["wayland-data-control"] }
serde_json = "1.0.149"
notify-rust = "4"
genai = "0.6.5"
futures = "0.3"
zeroize = "1.8"
subtle = "2.6"
crossbeam-channel = "0.5"
zstd = "0.13"
rusqlite = { version = "0.39", features = ["bundled"] }

rodio = { version = "0.22", default-features = false, features = ["wav", "playback"] }
os_info = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
unicode-normalization = "0.1"
reqwest = "0.13.4"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rdev = { version = "0.5.3", features = ["unstable_grab"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["std"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWorkspace", "NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
ksni = "0.3"
xkbcommon = "0.9.0"
x11rb = "0.14"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = "5"
libc = "0.2"
uuid = { version = "1.23.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.10"
