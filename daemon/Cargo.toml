[package]
name = "taurine_daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
license-file.workspace = true

[dependencies]
taurine_core = { path = "../core" }
tracing = { workspace = true }
tokio = { version = "1.0", features = ["full", "test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
arboard = { version = "3.4.1", features = ["wayland-data-control"] }
serde_json = "1.0.149"
notify-rust = "4"
genai = "0.6.5"
futures = "0.3"
zeroize = "1.8"
rodio = { version = "0.22", default-features = false, features = ["wav", "playback"] }
os_info = "3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rdev = { version = "0.5.3", features = ["unstable_grab"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["std"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWorkspace", "NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
xkbcommon = "0.9.0"
x11rb = "0.13"
