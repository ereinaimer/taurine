syntax = "proto3";

package taurine;

service DaemonControl {
    rpc GetStatus (StatusRequest) returns (StatusResponse);
    rpc Shutdown (ShutdownRequest) returns (ShutdownResponse);
    rpc Reload (ReloadRequest) returns (ReloadResponse);
    rpc Pause (PauseRequest) returns (PauseResponse);
    rpc Resume (ResumeRequest) returns (ResumeResponse);
    rpc Sync (SyncRequest) returns (SyncResponse);
}

message StatusRequest {}

message StatusResponse {
    bool online = 1;
    bool paused = 2;
    string pause_hotkey = 3;
    string keyboard_capture = 4;
    bool hook_listener_running = 5;
    uint64 hook_thread_started_at_unix_ms = 6;
    uint64 last_keyboard_event_at_unix_ms = 7;
    string last_hook_error = 8;
    string recovery_suggestion = 9;
}

message ShutdownRequest {}

message ShutdownResponse {
    bool success = 1;
}

message ReloadRequest {
    bool skip_sync = 1;
}

message ReloadResponse {
    bool success = 1;
}

message PauseRequest {}
message PauseResponse {
    bool success = 1;
}

message ResumeRequest {}
message ResumeResponse {
    bool success = 1;
}

message SyncRequest {}

message SyncResponse {
    bool success = 1;
    uint64 pulled_snippets = 2;
    uint64 pushed_snippets = 3;
    uint64 pulled_settings = 4;
    uint64 pushed_settings = 5;
    uint64 pulled_events = 6;
    uint64 pushed_stats = 7;
    string error_message = 8;
}
