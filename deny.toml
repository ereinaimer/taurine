# cargo-deny dependency policy. Checks: advisories, bans, licenses, sources.
# Local: cargo deny check   CI: .github/workflows/security.yml (weekly)

[advisories]
ignore = [
    # paste (via genai): unmaintained proc-macro; stable and widely used, no
    # maintained successor with equivalent API.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro via genai; no replacement available" },
    # quick-xml DoS pair: patched only in >=0.41.0, but every lockfile line is
    # pinned by third-party crates that cannot take 0.41 yet (plist 1.8 ^0.38,
    # tauri-winrt-notification 0.7 ^0.37, wayland-scanner 0.31 ^0.39 at build
    # time). All consumers parse trusted local data (plists, toast templates,
    # Wayland protocol XML); no network-reachable untrusted input in taurine.
    { id = "RUSTSEC-2026-0194", reason = "upstream-pinned lines; no untrusted XML parsing in taurine" },
    { id = "RUSTSEC-2026-0195", reason = "upstream-pinned lines; no untrusted XML parsing in taurine" },
]

[licenses]
# Allow list contains only permissive licenses. Copyleft (GPL/LGPL/AGPL/MPL)
# is deliberately excluded; the handful of pinned copyleft crates are carved
# out per-crate in `exceptions` below.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # r-efi (via getrandom): UEFI-firmware bindings; never compiled for any
    # desktop target. LGPL is a licensing footnote, not a shipped artifact.
    { allow = ["LGPL-2.1-or-later"], crate = "r-efi" },
    # scraper CSS-selector extraction in the [html(...)] transformer
    # (core/.../transformers/extractors.rs) pins the Mozilla cssparser/selectors
    # family. MPL-2.0 is file-level copyleft (notice preservation only).
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "symphonia" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-pcm" },
    { allow = ["MPL-2.0"], crate = "symphonia-core" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-riff" },
    { allow = ["MPL-2.0"], crate = "symphonia-metadata" },
    # epoll (via rdev): Linux input capture.
    { allow = ["MPL-2.0"], crate = "epoll" },
]

# Workspace crates (taurine, taurine_core, taurine_daemon, taurine_tui) are
# never published and carry only a custom license-file (no SPDX expression),
# so they are excluded from the license allowlist.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []