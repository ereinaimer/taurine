[package]
name = "taurine_tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
license-file.workspace = true
publish = false

[features]
# Lets the TUI fast loop skip the self-contained OpenSSL the same way core does:
#   cargo check -p taurine_tui --no-default-features
# Default build is unchanged.
default = ["vendored-openssl"]
vendored-openssl = ["taurine_core/vendored-openssl"]

[dependencies]
taurine_core = { path = "../core", default-features = false }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
tokio = { workspace = true }
tonic = "0.14"
tracing = { workspace = true }
zeroize = "1.8"
tachyonfx = "0.25"
tree-sitter-highlight = "0.27.0"
tree-sitter-bash = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-powershell = "0.26.4"
tree-sitter-batch = "0.11.1"
tree-sitter = "0.27.0"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
keyring = "3.6.3"

