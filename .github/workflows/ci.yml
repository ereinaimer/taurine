name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURINE_DATA_DIR: ${{ github.workspace }}/temp_data

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($status.RealTimeProtectionEnabled) {
            Set-MpPreference -DisableRealtimeScanning $true
          }

      - name: Install Protoc (Windows & macOS)
        if: runner.os != 'Linux'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '23.4'

      - name: Install Linux Dependencies (with mold)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            pkg-config \
            libdbus-1-dev \
            libclang-dev \
            protobuf-compiler \
            libwayland-dev \
            libxkbcommon-dev \
            libevdev-dev \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libxdo-dev \
            mold

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: Cache compile artifacts (sccache)
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Run Clippy
        env:
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=mold' || '' }}
        run: cargo clippy --locked --workspace --no-deps --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: [lint, validate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($status.RealTimeProtectionEnabled) {
            Set-MpPreference -DisableRealtimeScanning $true
          }

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install Protoc (Windows & macOS)
        if: runner.os != 'Linux'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '23.4'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            pkg-config \
            libdbus-1-dev \
            libclang-dev \
            protobuf-compiler \
            libwayland-dev \
            libxkbcommon-dev \
            libevdev-dev \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: Cache compile artifacts (sccache)
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Run tests (nextest)
        run: cargo nextest run --locked --workspace --all-features

      - name: Run doc tests (cargo test)
        run: cargo test --doc --locked --workspace --all-features