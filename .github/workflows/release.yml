name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            platform_key: windows-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.xz
            platform_key: linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.xz
            platform_key: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.xz
            platform_key: macos-aarch64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config cmake libxkbcommon-dev libdbus-1-dev libasound2-dev libglib2.0-dev libgtk-3-dev libxdo-dev

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '23.4'

      - name: Disable Windows Defender real-time scanning
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($status.RealTimeProtectionEnabled) {
            Set-MpPreference -DisableRealtimeScanning $true
          }

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"

      - name: Cache compile artifacts (sccache)
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11

      - name: Configure sccache GHA backend credentials
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p taurine

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ARCHIVE_NAME="taurine-v${VERSION}-${{ matrix.platform_key }}.zip"
          mkdir -p package
          cp target/${{ matrix.target }}/release/taurine.exe package/
          cp README.md package/
          cp CHANGELOG.md package/
          cp LICENSE package/
          cd package
          7z a ../$ARCHIVE_NAME *
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Package (Unix)
        if: matrix.archive == 'tar.xz'
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ARCHIVE_NAME="taurine-v${VERSION}-${{ matrix.platform_key }}.tar.xz"
          mkdir -p package
          cp target/${{ matrix.target }}/release/taurine package/
          cp README.md package/
          cp CHANGELOG.md package/
          cp LICENSE package/
          tar -cJf $ARCHIVE_NAME -C package .
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Compute checksum
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            echo "SHA256=$(sha256sum $ARCHIVE_NAME | cut -d' ' -f1)" >> $GITHUB_ENV
          elif command -v shasum &>/dev/null; then
            echo "SHA256=$(shasum -a 256 $ARCHIVE_NAME | cut -d' ' -f1)" >> $GITHUB_ENV
          else
            echo "SHA256=$(openssl dgst -sha256 $ARCHIVE_NAME | cut -d' ' -f2)" >> $GITHUB_ENV
          fi

      - name: Upload Artifact to Workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts-${{ matrix.platform_key }}
          path: ${{ env.ARCHIVE_NAME }}

      - name: Write checksum file
        shell: bash
        run: |
          echo "${{ env.SHA256 }}  ${{ env.ARCHIVE_NAME }}" > checksums-${{ matrix.platform_key }}.sha256

      - name: Upload Checksum File
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checksum-files-${{ matrix.platform_key }}
          path: checksums-${{ matrix.platform_key }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        
      - name: Extract Release Notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          python3 -c "
          import re
          version = '${VERSION}'
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          pattern = rf'(?s)## \[{re.escape(version)}\].*?(?=\n## \[|\Z)'
          match = re.search(pattern, content)
          if match:
              notes = match.group(0).strip()
              lines = notes.splitlines()
              body = '\n'.join(lines[1:]).strip()
          else:
              body = f'Release v{version}'
          with open('notes.md', 'w') as f:
              f.write(body)
          "
          
      - name: Download all workflow artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Download checksum files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: checksum-files-*
          path: checksums
          merge-multiple: true
          
      - name: Generate Manifest with Checksums
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          base_url="https://github.com/ereinaimer/taurine/releases/download/v${VERSION}"
          
          # Read checksums into variables
          windows_sha256=$(grep "windows-x86_64" checksums/*.sha256 2>/dev/null | cut -d' ' -f1 || echo "")
          linux_sha256=$(grep "linux-x86_64" checksums/*.sha256 2>/dev/null | cut -d' ' -f1 || echo "")
          macos_x64_sha256=$(grep "macos-x86_64" checksums/*.sha256 2>/dev/null | cut -d' ' -f1 || echo "")
          macos_arm_sha256=$(grep "macos-aarch64" checksums/*.sha256 2>/dev/null | cut -d' ' -f1 || echo "")
          
          python3 -c "
          import json, os
          version = '$VERSION'
          base_url = f'https://github.com/ereinaimer/taurine/releases/download/v{version}'
          manifest = {
              'version': version,
              'artifacts': {
                  'windows-x86_64': {
                      'url': f'{base_url}/taurine-v{version}-windows-x86_64.zip',
                      'sha256': '$windows_sha256'
                  },
                  'linux-x86_64': {
                      'url': f'{base_url}/taurine-v{version}-linux-x86_64.tar.xz',
                      'sha256': '$linux_sha256'
                  },
                  'macos-x86_64': {
                      'url': f'{base_url}/taurine-v{version}-macos-x86_64.tar.xz',
                      'sha256': '$macos_x64_sha256'
                  },
                  'macos-aarch64': {
                      'url': f'{base_url}/taurine-v{version}-macos-aarch64.tar.xz',
                      'sha256': '$macos_arm_sha256'
                  },
              }
          }
          with open('manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          "
          
      - name: Create Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PRERELEASE=""
          if [[ "${VERSION}" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create $GITHUB_REF_NAME \
            ./artifacts/* \
            manifest.json \
            --title "v$VERSION" \
            --notes-file notes.md \
            $PRERELEASE