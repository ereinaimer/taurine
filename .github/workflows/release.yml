name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            platform_key: windows-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.xz
            platform_key: linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.xz
            platform_key: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.xz
            platform_key: macos-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config cmake protobuf-compiler libxkbcommon-dev libdbus-1-dev libasound2-dev

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install protoc

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install protobuf

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ARCHIVE_NAME="taurine-v${VERSION}-${{ matrix.platform_key }}.zip"
          mkdir -p package
          cp target/${{ matrix.target }}/release/taurine.exe package/
          cp README.md package/
          cp CHANGELOG.md package/
          cp LICENSE package/
          cd package
          7z a ../$ARCHIVE_NAME *
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Package (Unix)
        if: matrix.archive == 'tar.xz'
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ARCHIVE_NAME="taurine-v${VERSION}-${{ matrix.platform_key }}.tar.xz"
          mkdir -p package
          cp target/${{ matrix.target }}/release/taurine package/
          cp README.md package/
          cp CHANGELOG.md package/
          cp LICENSE package/
          tar -cJf $ARCHIVE_NAME -C package .
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Upload Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.platform_key }}
          path: ${{ env.ARCHIVE_NAME }}

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        
      - name: Extract Release Notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          python3 -c "
          import re
          version = '${VERSION}'
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          pattern = rf'(?s)## \[{re.escape(version)}\].*?(?=\n## \[|\Z)'
          match = re.search(pattern, content)
          if match:
              notes = match.group(0).strip()
              lines = notes.splitlines()
              body = '\n'.join(lines[1:]).strip()
          else:
              body = f'Release v{version}'
          with open('notes.md', 'w') as f:
              f.write(body)
          "
          
      - name: Generate Manifest
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cat << 'EOF' > generate_manifest.py
          import sys, json
          version = sys.argv[1]
          base_url = f"https://github.com/ereinaimer/taurine/releases/download/v{version}"
          manifest = {
              "version": version,
              "artifacts": {
                  "windows-x86_64": {"url": f"{base_url}/taurine-v{version}-windows-x86_64.zip"},
                  "linux-x86_64": {"url": f"{base_url}/taurine-v{version}-linux-x86_64.tar.xz"},
                  "macos-x86_64": {"url": f"{base_url}/taurine-v{version}-macos-x86_64.tar.xz"},
                  "macos-aarch64": {"url": f"{base_url}/taurine-v{version}-macos-aarch64.tar.xz"},
              }
          }
          with open('manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          EOF
          python3 generate_manifest.py $VERSION
          
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          path: artifacts
          merge-multiple: true
          
      - name: Create Pre-Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh release create $GITHUB_REF_NAME \
            ./artifacts/* \
            manifest.json \
            --title "v$VERSION" \
            --notes-file notes.md \
            --prerelease