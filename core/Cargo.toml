[package]
name = "taurine_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
license-file.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
tracing = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6.0"
tracing-appender = "0.2.4"
tracing-subscriber = { workspace = true, features = ["env-filter", "time", "local-time"] }
time = { version = "0.3.47", features = ["macros", "local-offset", "formatting"] }
tracing-error = "0.2.1"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1.0", features = ["full"] }
ahash = "0.8"
parking_lot = "0.12"
uuid = { version = "1.23.0", features = ["v4", "v7"] }
os_info = "3"
arboard = { version = "3.4.1", features = ["wayland-data-control"] }
indexmap = "2.14.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
heck = "0.5"
base64 = "0.22"
md5 = "0.8"
sha2 = "0.11"
regex = "1.12"
hex = "0.4"
sha1 = "0.11"
crc32fast = "1.5"
zstd = "0.13"
aes-gcm = "0.11"
argon2 = "0.5"
rand = "0.10"
zeroize = "1.8"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
wait-timeout = "0.2"
fake = { version = "5.1.0", features = ["derive", "http"] }
service-manager = "0.11.0"
ureq = { version = "2.9", features = ["tls", "json"] }
scraper = "0.27"
serde_yml = { package = "yaml_serde", version = "0.10" }
toml = "1.1"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[target."cfg(windows)".dependencies]
sysinfo = "0.39.0"
winreg = "0.56.0"
